name: govulncheck

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  govulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        background: true

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - wait-all:

      - run: govulncheck -test -tags=integration,wporg_live ./...
