name: govulncheck

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
    security-events: write
    contents: read
    actions: read

jobs:
  govulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        background: true

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - wait-all:

      - name: Run govulncheck and save to file
        run: govulncheck -format=sarif -test -tags="${TAGS}" ./... > "${OUTPUT_FILE}"
        env:
          TAGS: integration,wporg_live
          OUTPUT_FILE: ${{ runner.temp }}/govulncheck.sarif
        shell: bash

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/govulncheck.sarif
          category: govulncheck
