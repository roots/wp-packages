---
- name: Check for pending reboot
  stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Warn about pending reboot
  debug:
    msg: >-
      Reboot required: running kernel {{ ansible_kernel }}, but newer packages
      are installed. Security fixes in them aren't active until the server
      is rebooted.
  when: reboot_required.stat.exists
